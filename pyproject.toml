[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practice23"
version = "1.0.0"
description = "Практика 1 — Сысоев Даниил Денисович — ИКБО-71-24"
requires-python = ">=3.11"
dependencies = ["defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["hypothesis>=6.100,<7", "coverage>=7,<8", "pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["practice23"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10
